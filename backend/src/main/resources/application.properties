spring.application.name=login-app
server.port=8080

# In-memory H2 database (stand-in for the office database)
spring.datasource.url=jdbc:h2:mem:loginapp;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Allowed origin for the Angular dev server
app.cors.allowed-origins=http://localhost:4200

# RSA key pair for password/OTP encryption (PKCS12 keystore, see scripts/generate-keystore.sh)
# The password has no default on purpose: startup fails unless LOGIN_KEYSTORE_PASSWORD is set.
app.rsa.keystore.path=${LOGIN_KEYSTORE_PATH:keys/login-keys.p12}
app.rsa.keystore.password=${LOGIN_KEYSTORE_PASSWORD}
app.rsa.keystore.alias=${LOGIN_KEYSTORE_ALIAS:login-rsa}

# Nonce for replay protection of encrypted values (single use)
app.nonce.expiry-seconds=120
app.nonce.max-active=10000

# Captcha
app.captcha.length=6
app.captcha.expiry-seconds=120

# OTP
app.otp.length=6
app.otp.expiry-seconds=300
app.otp.max-attempts=3

# JWT
app.jwt.secret=Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1qd3Qtc2VjcmV0LWtleS0xMjM0NTY3OA==
app.jwt.expiry-minutes=30
